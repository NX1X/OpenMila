#
# Cuts a release from a v* tag: Linux packages through Dagger, the Windows
# portable zip and Inno Setup installer on a Windows runner, a software bill of
# materials, checksums, build provenance, and a draft GitHub release for a human
# to publish.
#
# Release notes come first, as upstream requires: RELEASE_NOTES/v<version>.md
# must exist and say something, or the release stops before anything is built.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: read

env:
  DAGGER_VERSION: "0.21.9"
  DAGGER_SHA256: "33eea0b08d6be444bada18e64b2216459100d6070abcb4b5345cee40c9fff982"
  DAGGER_NO_NAG: "1"
  SWIFT_VERSION: "6.4.0"

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Release notes must exist and say something
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then version="${{ github.event.inputs.tag }}"; version="${version#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          notes="RELEASE_NOTES/v$version.md"
          test -s "$notes" || { echo "::error::$notes is missing or empty"; exit 1; }
          grep -qvE '^\s*(#|<!--|$)' "$notes" || { echo "::error::$notes has no content"; exit 1; }
          echo "release notes: $notes"
          test "$(cat UPSTREAM_VERSION)" != "" || { echo "::error::UPSTREAM_VERSION is empty"; exit 1; }

  linux:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install the Dagger CLI (pinned, checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          file="dagger_v${DAGGER_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 4 -o "$file" "https://github.com/dagger/dagger/releases/download/v${DAGGER_VERSION}/$file"
          echo "${DAGGER_SHA256}  $file" | sha256sum -c -
          tar xzf "$file" dagger
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Test everything before packaging
        timeout-minutes: 40
        run: dagger call --progress=plain check

      - name: Build the Linux packages
        timeout-minutes: 40
        run: dagger call --progress=plain packages export --path=dist

      - name: Software bill of materials
        timeout-minutes: 15
        run: dagger call --progress=plain sbom export --path=dist/openmila-sbom.cdx.json

      # Named, so a stray file in dist/ cannot become a release download.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.sha256
            dist/openmila-sbom.cdx.json
          if-no-files-found: error

  windows:
    needs: gate
    runs-on: windows-2025
    # The packaging step alone is budgeted 75 minutes and the installer another
    # 30, so the job needs room for both plus the toolchain steps.
    timeout-minutes: 140
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Cache the Swift toolchain
        id: swift-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\Users\runneradmin\AppData\Local\Programs\Swift
          key: swift-${{ env.SWIFT_VERSION }}-windows

      - name: Install Swift (Authenticode verified)
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.swift.org/swift-$env:SWIFT_VERSION-release/windows10/swift-$env:SWIFT_VERSION-RELEASE/swift-$env:SWIFT_VERSION-RELEASE-windows10.exe"
          $installer = "$env:RUNNER_TEMP\swift-installer.exe"
          curl.exe -fsSL --retry 4 -o $installer $url
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne "Valid") { throw "installer signature is $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -notmatch "Apple") { throw "unexpected signer" }
          Start-Process -FilePath $installer -ArgumentList "/quiet" -Wait

      - name: Put Swift on PATH
        run: |
          $swift = (Get-ChildItem "C:\Users\runneradmin\AppData\Local\Programs\Swift\Toolchains" | Select-Object -First 1).FullName + "\usr\bin"
          echo $swift | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache the whisper.cpp build
        id: whisper-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\whisper-prefix
          key: whisper-windows-vulkan-${{ hashFiles('.github/whisper-cpp-pin.txt', 'scripts/port/build-whisper.ps1') }}

      # A release build must carry the GPU backend, so the SDK is not optional
      # here the way it is for a developer's local build.
      - name: Install the Vulkan SDK
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          choco install vulkan-sdk --no-progress -y
          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "the Vulkan SDK did not install; a release must ship the GPU backend" }
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build whisper.cpp at the pinned commit
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: .\scripts\port\build-whisper.ps1 -Prefix "$env:GITHUB_WORKSPACE\whisper-prefix"

      # Inno Setup compiles the installer. Pinned to a version: a bare
      # "choco install innosetup" takes whatever is newest that day, and a
      # compiler that changes underneath a release makes the release
      # unreproducible. --require-checksums refuses a package that does not pin
      # a checksum for the vendor installer it downloads.
      #
      # Before the packaging step rather than after it: this takes a minute and
      # the packaging takes over an hour, so a missing compiler should fail now.
      - name: Install Inno Setup (pinned)
        timeout-minutes: 10
        run: |
          choco install innosetup --version 6.7.1 --no-progress -y --require-checksums
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6.7.1 did not install: $iscc is missing" }
          Write-Host "ISCC: $iscc"

      # A release package is built in release configuration from scratch: the
      # UI toolkit alone is over half an hour.
      - name: Package the portable zip
        timeout-minutes: 75
        run: .\packaging\windows\package.ps1 -Prefix "$env:GITHUB_WORKSPACE\whisper-prefix" -Version "${{ needs.gate.outputs.version }}"

      # The installer, from the same staging directory the zip above was made
      # from. It builds nothing: if that stage is missing or incomplete the
      # script stops here rather than shipping an installer that installs a
      # broken app.
      - name: Build the Windows installer
        timeout-minutes: 30
        run: .\packaging\windows\build-installer.ps1 -Version "${{ needs.gate.outputs.version }}"

      # The two artifacts and their checksums, named one by one, not the staging
      # directory they were built from: "dist/*" put every loose .exe and .dll on
      # the release page as its own download, next to the zip that already
      # contained them. Keep this list explicit for the same reason.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256
          if-no-files-found: error

  publish:
    needs: [gate, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Collect the release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Attest what was built
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: "release/*"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft $prerelease \
            --title "OpenMila $VERSION" \
            --notes-file "RELEASE_NOTES/v$VERSION.md"
