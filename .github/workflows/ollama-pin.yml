#
# The local AI runtime is a pinned Ollama release whose digests live in
# Port/LocalAI/ManagedOllama.swift. Ollama publishes no signatures, so the pin
# is the trust anchor; this asks the vendor weekly whether it still publishes
# the same digests for that release. Drift means the assets were replaced.
name: Ollama pin

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "Port/LocalAI/ManagedOllama.swift"
      - "scripts/port/check-ollama-pin.sh"
      - ".github/workflows/ollama-pin.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The vendor still publishes the pinned digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/port/check-ollama-pin.sh
