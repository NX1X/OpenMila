#
# OpenMila's Windows build. Dagger runs the Linux pipeline in a container;
# Windows cannot be containerised on a Linux runner, so this job builds
# natively on a Windows runner with the same pinned toolchain and the same
# whisper.cpp commit.
#
# Windows minutes bill at twice the Linux rate, and this job is the most
# expensive thing in the repository, so it is rationed:
#   - pushes to main and pull requests build the core, the CLI, the MCP helper
#     and run the tests (about 20 minutes);
#   - the desktop app and the portable zip, which are another half hour, run
#     only on main, on a tag, or when the workflow is started by hand;
#   - every Swift build directory is cached, so a run that changes no
#     dependencies reuses the previous compile.
name: OpenMila Windows

on:
  push:
    branches: ["main", "port/windows**"]
    paths-ignore:
      - "docs/**"
      - "docs-internal/**"
      - "**/*.md"
      # Upstream files this workflow does NOT build. Mila/ and MilaTests/ are
      # deliberately absent (the port compiles both), and so is brand/, which
      # the packaging step copies into the zip.
      - "MilaUITests/**"
      - "MilaMCP/**"
      - "RELEASE_NOTES/**"
      - "project.yml"
      - "docker/**"
      - ".cursor/**"
      - "bugbot-rules/**"
      - "skills/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "docs-internal/**"
      - "**/*.md"
      # Upstream files this workflow does NOT build. Mila/ and MilaTests/ are
      # deliberately absent (the port compiles both), and so is brand/, which
      # the packaging step copies into the zip.
      - "MilaUITests/**"
      - "MilaMCP/**"
      - "RELEASE_NOTES/**"
      - "project.yml"
      - "docker/**"
      - ".cursor/**"
      - "bugbot-rules/**"
      - "skills/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Also build the desktop app and the portable zip (about 30 minutes)"
        type: boolean
        default: true
      diarization:
        description: "Also build the diarization Python runtime (slow, ~2 GB of downloads)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: openmila-windows-${{ github.ref }}
  # A second push to main must not cancel a run already building main (Windows
  # minutes bill double, and a cancelled main build leaves no cached app/zip
  # for that commit); only superseded pull request runs are worth cancelling.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  SWIFT_VERSION: "6.4.0"

jobs:
  windows:
    runs-on: windows-2025
    # contents: write for one thing: force-pushing the ci-screenshots branch
    # from a push to main. A pull request run gets a read-only token from
    # GitHub regardless of what is asked for here.
    permissions:
      contents: write
    # A full run (core, tests, app, zip) is about an hour; a hung job at the
    # old two-hour limit cost two hours of Windows minutes, which bill double.
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Cache the Swift toolchain
        id: swift-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\Users\runneradmin\AppData\Local\Programs\Swift
          key: swift-${{ env.SWIFT_VERSION }}-windows

      - name: Install Swift (Authenticode verified)
        if: steps.swift-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.swift.org/swift-$env:SWIFT_VERSION-release/windows10/swift-$env:SWIFT_VERSION-RELEASE/swift-$env:SWIFT_VERSION-RELEASE-windows10.exe"
          $installer = "$env:RUNNER_TEMP\swift-installer.exe"
          curl.exe -fsSL --retry 4 -o $installer $url
          # swift.org publishes no detached signature for the Windows installer;
          # it is Authenticode signed instead. Refuse anything not signed by
          # Apple, so a tampered download cannot install itself.
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne "Valid") { throw "installer signature is $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -notmatch "Apple") { throw "unexpected signer: $($signature.SignerCertificate.Subject)" }
          Write-Host "signed by: $($signature.SignerCertificate.Subject)"
          Start-Process -FilePath $installer -ArgumentList "/quiet" -Wait

      - name: Put Swift on PATH
        run: |
          $swift = "C:\Users\runneradmin\AppData\Local\Programs\Swift\Toolchains\$env:SWIFT_VERSION+Asserts\usr\bin"
          if (-not (Test-Path $swift)) { $swift = (Get-ChildItem "C:\Users\runneradmin\AppData\Local\Programs\Swift\Toolchains" | Select-Object -First 1).FullName + "\usr\bin" }
          echo $swift | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $runtime = "C:\Users\runneradmin\AppData\Local\Programs\Swift\Runtimes\$env:SWIFT_VERSION\usr\bin"
          echo $runtime | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Swift version
        run: swift --version

      - name: Cache the whisper.cpp build
        id: whisper-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\whisper-prefix
          key: whisper-windows-vulkan-${{ hashFiles('.github/whisper-cpp-pin.txt', 'scripts/port/build-whisper.ps1') }}

      - name: Cache the Swift build directories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            Port/App/.build
          # The toolchain, the resolved dependencies and the engine decide what
          # a rebuild costs; the run id keeps each run's cache separate, and
          # the restore keys fall back to the newest cache for this branch.
          key: swiftbuild-windows-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.resolved', 'Port/App/Package.resolved', '.github/whisper-cpp-pin.txt') }}-${{ github.run_id }}
          restore-keys: |
            swiftbuild-windows-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.resolved', 'Port/App/Package.resolved', '.github/whisper-cpp-pin.txt') }}-
            swiftbuild-windows-${{ env.SWIFT_VERSION }}-

      # whisper.cpp's Vulkan backend needs the SDK's headers and glslc at build
      # time only: the result runs on a machine with just the driver, and the
      # port refuses a GPU that is not worth using before it asks for one.
      - name: Install the Vulkan SDK
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          choco install vulkan-sdk --no-progress -y
          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1
          if ($sdk) {
            "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "VULKAN_SDK=$($sdk.FullName)"
          } else {
            Write-Warning "no Vulkan SDK found after install; whisper.cpp will build the CPU backend only"
          }

      - name: Build whisper.cpp at the pinned commit
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: .\scripts\port\build-whisper.ps1 -Prefix "$env:GITHUB_WORKSPACE\whisper-prefix"

      - name: Build the core, the CLI and the MCP helper
        timeout-minutes: 25
        run: .\scripts\port\build-windows.ps1 -Prefix "$env:GITHUB_WORKSPACE\whisper-prefix"

      - name: Run the port's tests
        timeout-minutes: 20
        run: .\scripts\port\build-windows.ps1 -Prefix "$env:GITHUB_WORKSPACE\whisper-prefix" -Test

      # Off by default: the runtime is about 2 GB of wheels, which is not worth
      # downloading on every push. Run the workflow by hand with the input set
      # when the bundle script or its pins change.
      - name: Build the diarization Python runtime
        if: inputs.diarization
        timeout-minutes: 40
        run: .\diarization\build-bundle-windows.ps1

      # The app and the zip are the expensive half of this job: they run on a
      # push (that is main, since pull requests cover the branches) and when
      # the workflow is started by hand with the input left on. A pull request
      # gets the core and the tests, which is what catches a Windows break.
      - name: Build the desktop app
        if: github.event_name == 'push' || inputs.app
        # The UI toolkit and its WinUI bindings are the long pole: about 35
        # minutes from cold, a few minutes when the cache restores.
        timeout-minutes: 45
        run: .\scripts\port\build-windows.ps1 -Prefix "$env:GITHUB_WORKSPACE\whisper-prefix" -App

      # The user interface is WinUI, which needs Microsoft's Windows App
      # Runtime present before openmila.exe can start at all. Packaging runs
      # the app to prove the payload works, so the runner needs it too. Pinned
      # to the version swift-winui targets and checked against its digest.
      - name: Install the Windows App Runtime
        timeout-minutes: 10
        run: |
          $url = "https://aka.ms/windowsappsdk/1.5/1.5.240205001-preview1/windowsappruntimeinstall-x64.exe"
          $expected = "b906084876a0875d3401a7b4dc5a5a6da24ad7eb4a30ed8c05aa88085411817c"
          $installer = "$env:RUNNER_TEMP\WindowsAppRuntimeInstall-x64.exe"
          curl.exe -fsSL --retry 4 -o $installer $url
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "the Windows App Runtime download has digest $actual, expected $expected" }
          & $installer --quiet
          Write-Host "Windows App Runtime installed"

      - name: Package the portable zip
        if: github.event_name == 'push' || inputs.app
        timeout-minutes: 20
        run: .\packaging\windows\package.ps1 -Prefix "$env:GITHUB_WORKSPACE\whisper-prefix" -Configuration debug

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' || inputs.app
        with:
          name: openmila-windows-zip
          path: dist/*.zip
          if-no-files-found: error
          # Long enough to fetch a build from CI, short enough that a 114 MB
          # zip per merge does not accumulate.
          retention-days: 7

      # What the WinUI build actually draws. Nobody on this project has a
      # Windows desktop at hand while developing, and the first hands-on report
      # was "a third of the page and black boxes", so the runner starts the
      # packaged app, captures its window, and uploads the images.
      - name: Screenshot the app
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          $stage = Get-ChildItem dist -Directory -Filter "OpenMila-*-win64" | Select-Object -First 1
          if (-not $stage) { Write-Host "no staged payload to screenshot"; exit 0 }
          .\scripts\port\screenshot-windows.ps1 -Stage $stage.FullName -Out "$env:RUNNER_TEMP\shots"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-screenshots
          path: ${{ runner.temp }}\shots\*
          if-no-files-found: ignore
          retention-days: 14

      # The images also go to a single-commit side branch, because the
      # artifact store is served from a host some networks cannot reach and
      # the whole point of the capture is that someone can look at it. Only on
      # a push to main: a pull request's token is read-only anyway, and a
      # branch that only ever holds the latest main build is what is wanted.
      - name: Publish the screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 5
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SCREENSHOTS_TOKEN || github.token }}
        run: |
          $shots = "$env:RUNNER_TEMP\shots"
          if (-not (Test-Path "$shots\window.png")) { Write-Host "nothing captured"; exit 0 }
          $work = "$env:RUNNER_TEMP\shots-branch"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item "$shots\*.png", "$shots\openmila.log" $work -ErrorAction SilentlyContinue
          Set-Content -Path "$work\README.md" -Value @(
            "# What the Windows build draws",
            "",
            "Captured by the OpenMila Windows workflow on the runner, from commit ${{ github.sha }}.",
            "One commit, replaced on every push to main; not history, just the latest look."
          )
          Push-Location $work
          git init -q -b ci-screenshots
          git config user.name "openmila-ci"
          git config user.email "openmila-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "screenshots from ${{ github.sha }}"
          git push -q --force "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git" ci-screenshots
          Pop-Location
          Write-Host "pushed to ci-screenshots"

      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build-log
          path: ${{ github.workspace }}\build-windows.log
          if-no-files-found: ignore
          retention-days: 7
