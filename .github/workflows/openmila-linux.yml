#
# OpenMila's Linux pipeline, run through Dagger (ci/dagger). The same
# `dagger call check` runs on a laptop; this file only installs the pinned
# Dagger CLI and calls it.
name: OpenMila Linux

# A branch with an open pull request was building twice, once for the push and
# once for the pull request. Pushes are watched on main only; everything else
# is covered by its pull request.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "docs-internal/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openmila-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  DAGGER_VERSION: "0.21.9"
  # sha256 of dagger_v0.21.9_linux_amd64.tar.gz, from the release's checksums.txt.
  DAGGER_SHA256: "33eea0b08d6be444bada18e64b2216459100d6070abcb4b5345cee40c9fff982"
  DAGGER_NO_NAG: "1"

jobs:
  linux:
    runs-on: ubuntu-24.04
    # A full run is about 15 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # Upstream tracks CLAUDE.md and .claude/, so an upstream merge puts them
      # back unless the merge removes them again. This catches that before the
      # local editor configuration reaches a public repository.
      - name: Claude Code files stay out of the repository
        timeout-minutes: 2
        run: |
          tracked=$(git ls-files 'CLAUDE.md' '.claude/*' || true)
          if [ -n "$tracked" ]; then
            echo "::error::these are local-only files and must not be tracked:"
            echo "$tracked"
            exit 1
          fi
          echo "no Claude Code files are tracked"

      - name: Install the Dagger CLI (pinned, checksum verified)
        timeout-minutes: 5
        run: |
          cd "$RUNNER_TEMP"
          file="dagger_v${DAGGER_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 4 -o "$file" "https://github.com/dagger/dagger/releases/download/v${DAGGER_VERSION}/$file"
          echo "${DAGGER_SHA256}  $file" | sha256sum -c -
          tar xzf "$file" dagger
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The desktop app is over half the pipeline's time, so a pull request
      # runs everything else and a push to main adds the app.
      - name: Run the pipeline (dagger call check)
        # The pipeline is about 15 minutes with the app, 8 without; this is the
        # backstop for a stage that wedges rather than fails.
        timeout-minutes: 40
        run: dagger call --progress=plain check --with-app=${{ github.event_name == 'push' }}
