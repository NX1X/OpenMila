<!-- OpenMila stacked lockup: mark above the wordmark. Same geometry as
     brand/logo.svg, re-laid out for square and narrow spaces. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400"
     role="img" aria-label="OpenMila">
  <defs>
    <linearGradient id="om-tile" gradientUnits="userSpaceOnUse" x1="128" y1="0" x2="128" y2="256">
      <stop offset="0" stop-color="#3D9BFF"/>
      <stop offset="1" stop-color="#0057D8"/>
    </linearGradient>
  </defs>
  <g id="mark" transform="translate(200,48) scale(0.625)">
    <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#om-tile)"/>
    <circle cx="128" cy="128" r="80" fill="none" stroke="#FFFFFF" stroke-width="20"
            stroke-linecap="round" stroke-dasharray="410.5 92.15" stroke-dashoffset="456.58"/>
    <rect x="84" y="100" width="24" height="56" rx="12" fill="#FFFFFF"/>
    <rect x="116" y="80" width="24" height="96" rx="12" fill="#FFFFFF"/>
    <rect x="148" y="100" width="24" height="56" rx="12" fill="#FFFFFF"/>
  </g>
  <g id="wordmark" transform="translate(67,212) scale(0.75)" fill="none" stroke="#121417"
     stroke-width="16" stroke-linecap="round">
    <circle cx="44" cy="100" r="36"/>
    <line x1="108" y1="82" x2="108" y2="172"/>
    <circle cx="131" cy="113" r="23"/>
    <circle cx="205" cy="113" r="23" stroke-dasharray="114.41 30.11" stroke-dashoffset="114.41"/>
    <line x1="182" y1="113" x2="228" y2="113"/>
    <line x1="256" y1="82" x2="256" y2="144"/>
    <circle cx="279" cy="113" r="23" stroke-dasharray="72.26 72.26" stroke-dashoffset="72.26"/>
    <line x1="302" y1="113" x2="302" y2="144"/>
    <line x1="330" y1="144" x2="330" y2="56"/>
    <line x1="330" y1="56" x2="372" y2="120"/>
    <line x1="372" y1="120" x2="414" y2="56"/>
    <line x1="414" y1="56" x2="414" y2="144"/>
    <line x1="442" y1="82" x2="442" y2="144"/>
    <circle cx="442" cy="58" r="9" fill="#121417" stroke="none"/>
    <line x1="472" y1="52" x2="472" y2="144"/>
    <circle cx="525" cy="113" r="23"/>
    <line x1="548" y1="82" x2="548" y2="144"/>
  </g>
</svg>
